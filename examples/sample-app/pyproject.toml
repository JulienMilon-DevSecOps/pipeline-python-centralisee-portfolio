# Mini API d'exemple : la CI de la vitrine lui applique
# .github/workflows/python-docker.example.yml (lint, tests, analyse, build sans push)
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-app"
version = "0.1.0"
description = "API d'exemple de la vitrine pipeline-python"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
# Installé par la pipeline : pip install -e ".[test]" (input project_extras)
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "ANN", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# assert est la façon normale d'écrire un test pytest
"tests/*" = ["S101"]
