# ─────────────────────────────────────────────────────────────────────────────
# Workflow réutilisable : package Python — VERSION VITRINE SIMPLIFIÉE
#
# Usage (projet consommateur) : examples/consumer-package/ci.yml
#   uses: my-org/pipeline-python-factory/.github/workflows/python-package.example.yml@1.0.0
#
# Déroulé :
#   checks (python-checks.yml) : rules, secret-detection, ruff, pytest, dependency-scan
#   build-package              : wheel + sdist, twine check --strict
#   publish-pypi               : V-x.y.z     → PyPI     (secret PYPI_TOKEN)
#   publish-testpypi           : V-x.y.z-rcN → TestPyPI (secret TEST_PYPI_TOKEN)
#
# La pipeline privée propose aussi le Trusted Publishing (OIDC, aucun secret
# stocké) ; il n'est pas reproduit ici.
# ─────────────────────────────────────────────────────────────────────────────
name: python-package

on:
  workflow_call:
    inputs:
      python_version:
        type: string
        default: "3.12"
      project_dir:
        type: string
        default: "."
      requirements_files:
        type: string
        default: "requirements.txt"
      project_extras:
        type: string
        default: "test"
      pytest_enabled:
        type: boolean
        default: true
      pytest_args:
        type: string
        default: "-v"
      pytest_cov_source:
        type: string
        default: "."
      ruff_allow_failure:
        type: boolean
        default: false
      dependency_scan_allow_failure:
        type: boolean
        default: false
    secrets:
      PYPI_TOKEN:
        required: false
      TEST_PYPI_TOKEN:
        required: false

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/python-checks.yml
    permissions:
      contents: read
    with:
      python_version: ${{ inputs.python_version }}
      project_dir: ${{ inputs.project_dir }}
      requirements_files: ${{ inputs.requirements_files }}
      project_extras: ${{ inputs.project_extras }}
      pytest_enabled: ${{ inputs.pytest_enabled }}
      pytest_args: ${{ inputs.pytest_args }}
      pytest_cov_source: ${{ inputs.pytest_cov_source }}
      ruff_allow_failure: ${{ inputs.ruff_allow_failure }}
      dependency_scan_allow_failure: ${{ inputs.dependency_scan_allow_failure }}

  # python -m build construit dans un environnement isolé ; twine check --strict
  # vérifie métadonnées et README dès le build, pas au moment de publier.
  build-package:
    needs: checks
    if: needs.checks.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}
      - working-directory: ${{ inputs.project_dir }}
        run: |
          python -m pip install --quiet --upgrade pip build twine
          python -m build --outdir "$GITHUB_WORKSPACE/dist"
          python -m twine check --strict "$GITHUB_WORKSPACE"/dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Une base commune, deux cibles : chaque job ne fixe que ses paramètres (env:),
  # l'étape d'upload est partagée par ancre YAML.
  publish-pypi:
    needs: [checks, build-package]
    if: needs.checks.outputs.kind == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}/
    env:
      UPLOAD_URL: https://upload.pypi.org/legacy/
      SECRET_NAME: PYPI_TOKEN
      TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - &download_dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - &twine_upload
        name: twine upload
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret $SECRET_NAME absent (secrets: inherit dans le workflow du projet ?)"
            exit 1
          fi
          python3 -m pip install --quiet twine
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$TOKEN" python3 -m twine upload --repository-url "$UPLOAD_URL" dist/*

  publish-testpypi:
    needs: [checks, build-package]
    if: needs.checks.outputs.kind == 'rc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/${{ github.event.repository.name }}/
    env:
      UPLOAD_URL: https://test.pypi.org/legacy/
      SECRET_NAME: TEST_PYPI_TOKEN
      TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
    steps:
      - *download_dist
      - *twine_upload
